name: Pages Client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages-client.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-client
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy mobile client
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload client
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
